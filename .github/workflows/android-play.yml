# Android release: build the Capacitor app, sign it with the upload key and
# send it to a Google Play track. Manual only, so a push never ships a build.
#
# Repository secrets (values live in Vaultwarden ASISTENT, never in git):
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks, alias "upload")
#   ANDROID_KEYSTORE_PASSWORD  store password = key password
#   PLAY_SERVICE_ACCOUNT_JSON  jay-play-publisher service account key
# Play App Signing is on: Google holds the app signing key, this key only
# proves the upload and can be reset in Play Console if lost.

name: Android Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      version_name:
        description: versionName shown to players
        required: true
        default: "1.0"

permissions:
  contents: read

concurrency:
  group: android-play
  cancel-in-progress: false

env:
  GAME: BurgerRush
  PACKAGE: cz.zcloud.burgerrush

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The game imports ../RestaurantCommon, so both repos sit side by side.
      - uses: actions/checkout@v4
        with:
          path: ${{ env.GAME }}
      - uses: actions/checkout@v4
        with:
          repository: zcloudcz/RestaurantCommon
          path: RestaurantCommon
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web and sync Android
        run: |
          (cd RestaurantCommon && npm ci)
          cd "$GAME"
          npm ci
          npm run build
          npx cap sync android

      # versionCode must grow with every upload; run_number does, and the
      # offset keeps it above the first build uploaded by hand (versionCode 1).
      - name: Signed AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_NAME: ${{ inputs.version_name || '1.0' }}
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          export ANDROID_VERSION_CODE=$(( ${{ github.run_number }} + 1 ))
          cd "$GAME/android"
          bash ./gradlew --no-daemon bundleRelease
          rm -f "$ANDROID_KEYSTORE_FILE"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE }}
          releaseFiles: ${{ env.GAME }}/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
